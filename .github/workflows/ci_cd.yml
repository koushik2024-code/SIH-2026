name: Production CI/CD Pipeline (Part 5.5)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # =================================================================
  # 1. Code Validation & Configuration Linting
  # =================================================================
  lint-and-validate:
    name: Lint & Configuration Sanity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Base Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python Syntax Across Project
        run: |
          python -m compileall src/ config/ scripts/ main.py

      - name: Validate Docker Compose Configurations
        run: |
          python -c "import yaml; yaml.safe_load(open('docker-compose.yml')); yaml.safe_load(open('docker-compose.dev.yml')); print('Docker Compose YAML is valid.')"

  # =================================================================
  # 2. Comprehensive Test Discovery
  # =================================================================
  test-suite:
    name: Full Test Discovery Suite (Parts 1 - 5.5)
    needs: lint-and-validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Full Test Discovery Suite
        run: |
          python -m unittest discover -s tests -v

  # =================================================================
  # 3. Docker Container Build & Direct Health Probe
  # =================================================================
  docker-build-verify:
    name: Docker Build & In-Container Health Probe
    needs: test-suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: sih2026-fire-monitoring:latest
          load: true

      - name: Verify In-Container Direct Health Probe
        run: |
          docker run --rm sih2026-fire-monitoring:latest python scripts/healthcheck.py --service system

  # =================================================================
  # 4. Production Deployment Readiness Pre-Flight Check
  # =================================================================
  deployment-readiness:
    name: Deployment Pre-Flight Verification
    needs: docker-build-verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Execute CLI Pre-Flight Verification
        run: |
          python main.py --part 5.5
