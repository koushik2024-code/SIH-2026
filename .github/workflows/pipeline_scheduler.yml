name: Automated Thermal Data Pipeline (Part 5.1)

on:
  schedule:
    # Runs every 6 hours: at 00:00, 06:00, 12:00, 18:00 UTC
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Allows manual trigger anytime from GitHub Actions tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Part 5.1 Automated Data Pipeline
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: |
          python main.py --part 5 --run-once --days 2

      - name: Rebuild Static Suite & JSON Telemetry
        run: |
          python build_static.py

      - name: Commit & Push Updated Detections and Maps
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/ map.html static/ index.html alerts.html reports.html analytics.html
          if git diff --staged --quiet; then
            echo "No new data changes to commit."
          else
            git commit -m "Auto-update: Part 5.1 satellite fire detections & map [skip ci]"
            git push origin main
          fi
